
name: Security and AI Review

on:
  pull_request:
    branches:
      - Day9
  push:
    branches:
      - Day9

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . fastapi uvicorn pytest pytest-playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -m e2e --tracing=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }

  ai-review:
    if: github.event_name == 'pull_request'
    name: AI Code Review (Groq)
    runs-on: ubuntu-latest

    needs: [secrets-scan, e2e]

    permissions:
      contents: read
      pull-requests: write   # post the review comment on the PR
      issues: write          # PR conversation comments use the issues API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install reviewer dependencies
        run: pip install requests

      - name: Run Groq PR review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python agent/ci_pr_review.py ${{ github.event.pull_request.number }}
