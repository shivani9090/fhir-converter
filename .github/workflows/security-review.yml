
name: Security and AI Review

on:
  pull_request:
    branches:
      - Day9
  push:
    branches:
      - Day9

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
  needs: secrets-scan
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - run: pip install -e . fastapi uvicorn pytest pytest-playwright
    - run: python -m playwright install --with-deps chromium
    - run: pytest tests/e2e -m e2e --tracing=retain-on-failure
    - uses: actions/upload-artifact@v4
      if: failure()
      with: { name: playwright-traces, path: test-results/ }

  claude-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest

    needs: secrets-scan

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            Review this pull request for the FHIR Converter
            application.

            Use this skill.md file for pull request review:
              .claude\skills\github-pr-review\SKILL.md

            Review only the changes introduced in this PR.

            Check:
            1. Security vulnerabilities.
            2. Python and FastAPI code quality.
            3. FHIR conversion correctness.
            4. API validation and exception handling.
            5. Regression risks.
            6. Missing test coverage.

            Post a detailed review comment on the PR.

            Include severity, file, line number,
            explanation and recommended fix.

            Do not modify files, commit, push or merge.

          claude_args: |
            --max-turns 5
